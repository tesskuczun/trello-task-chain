<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Task order</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      :root {
        --text: #172b4d; --muted: #626f86; --line: #dcdfe4; --goal-bg: #e9f2ff;
        --done: #1f845a; --next: #0c66e4; --wait: #8590a2; --flag: #c25100;
      }
      body.dark {
        --text: #dee4ea; --muted: #9fadbc; --line: #3b444c; --goal-bg: #1c2b41;
        --done: #4bce97; --next: #579dff; --wait: #738496; --flag: #fea362;
      }
      html, body { margin: 0; padding: 0; background: transparent; }
      body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
      #root { padding: 2px 0 6px; }
      .goal {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px;
        background: var(--goal-bg); border-radius: 8px; font-weight: 600;
      }
      .goal .tag { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); white-space: nowrap; }
      .label { font-size: 12px; color: var(--muted); margin: 10px 0 4px 22px; }
      .stack { margin-left: 22px; border-left: 2px solid var(--line); padding-left: 12px; }
      .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
      .num {
        flex: none; width: 22px; height: 22px; border-radius: 50%; color: #fff;
        font-size: 12px; font-weight: 700; display: grid; place-items: center;
      }
      .done .num { background: var(--done); }
      .next .num { background: var(--next); }
      .wait .num { background: var(--wait); }
      .after .num { background: transparent; border: 2px solid var(--wait); color: var(--muted); width: 18px; height: 18px; }
      .name { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .name:hover { text-decoration: underline; }
      .done .name { color: var(--muted); text-decoration: line-through; }
      .status { margin-left: auto; font-size: 12px; white-space: nowrap; color: var(--muted); }
      .next .status { color: var(--next); font-weight: 600; }
      .done .status { color: var(--done); }
      .flag { color: var(--flag); }
      svg { flex: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./shared.js"></script>
    <script src="./section.js"></script>
  </body>
</html>
